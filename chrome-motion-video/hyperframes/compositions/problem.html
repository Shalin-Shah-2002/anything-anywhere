  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });

      // --- Tab strip: 3 tabs multiply to 32 while each squeezes thinner (a pure function of `n`).
      const tabs = Array.from(document.querySelectorAll("#p-tabs .p-tab"));
      const STRIP = 1468;
      const state = { n: 3 };
      function layoutTabs() {
        const n = state.n;
        const w = Math.min(220, STRIP / n);
        for (let i = 0; i < tabs.length; i++) {
          const vis = Math.max(0, Math.min(1, n - i));
          const el = tabs[i];
          el.style.opacity = vis;
          el.style.transform = "translate(" + (i * w).toFixed(2) + "px," + (10 * (1 - vis)).toFixed(2) + "px)";
          el.firstElementChild.style.transform = "scaleX(" + ((w - 4) / 216).toFixed(4) + ")";
          el.lastElementChild.style.opacity = w > 34 ? 1 : Math.max(0, (w - 22) / 12);
        }
      }
      layoutTabs();

      // Window arrives
      tl.fromTo("#p-win", { opacity: 0, scale: 0.94, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "expo.out" }, 0);
      // Tabs multiply, accelerating
      tl.fromTo(state, { n: 3 }, { n: 32, duration: 2.55, ease: "power2.in", onUpdate: layoutTabs }, 0.12);

      // Kinetic lines: rise out of the mask, pushed off by the next
      tl.fromTo("#p-l1", { yPercent: 110 }, { yPercent: 0, duration: 0.5, ease: "expo.out" }, 0.18);
      tl.to("#p-l1", { yPercent: -110, duration: 0.28, ease: "power3.in" }, 1.02);
      tl.fromTo("#p-l2", { yPercent: 110 }, { yPercent: 0, duration: 0.5, ease: "expo.out" }, 1.16);
      tl.to("#p-l2", { yPercent: -110, duration: 0.28, ease: "power3.in" }, 1.94);
      tl.fromTo("#p-l3", { yPercent: 110 }, { yPercent: 0, duration: 0.5, ease: "expo.out" }, 2.08);

      // Popups stack up
      const pop = (sel, t, rot) =>
        tl.fromTo(sel, { opacity: 0, scale: 0.82, y: 26, rotation: rot * 2 }, { opacity: 1, scale: 1, y: 0, rotation: rot, duration: 0.42, ease: "back.out(1.6)" }, t);
      pop("#p-notif", 0.72, -2);
      pop("#p-cookie", 1.3, 0);
      pop("#p-form", 1.18, 1.5);
      for (let i = 0; i < 5; i++) {
        tl.fromTo("#p-fill-" + i, { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power2.out" }, 1.42 + i * 0.12);
      }
      pop("#p-scam", 2.06, 3);
      tl.to("#p-scam", { keyframes: { rotation: [3, -4, 4, -3, 2, 0], ease: "none" }, duration: 0.42 }, 2.44);
      pop("#p-prize", 2.32, -3);

      // Implode: everything rushes into one white dot at the centre
      const T = 3.02;
      const pull = [
        ["#p-prize", 1460, 490],
        ["#p-scam", 1415, 275],
        ["#p-form", 975, 480],
        ["#p-cookie", 960, 696],
        ["#p-notif", 580, 266],
        ["#p-win", 960, 425],
      ];
      pull.forEach(([sel, cx, cy], i) => {
        tl.to(sel, { x: 960 - cx, y: 540 - cy, scale: 0.02, opacity: 0, rotation: 0, duration: 0.48, ease: "power3.in" }, T + i * 0.035);
      });
      tl.to("#p-l3", { yPercent: -60, scale: 0.2, opacity: 0, duration: 0.42, ease: "power3.in" }, T + 0.06);
      tl.to("#p-flat", { opacity: 1, duration: 0.5, ease: "power2.inOut" }, T);
      tl.fromTo("#p-dot", { scale: 0 }, { scale: 1, duration: 0.24, ease: "back.out(2)" }, T + 0.42);

      window.__timelines["problem"] = tl;
    })();
  </script>
