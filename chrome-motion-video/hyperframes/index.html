<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b0d12;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <!--
      Two scenes rendered back to back, then split by the Remotion pipeline:
        problem  0.000 – 3.833 s  (230 frames at 60 fps)  → SC 01
        endcard  3.833 – 7.633 s  (228 frames at 60 fps)  → SC 09
    -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="7.6333"
      data-fps="60"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="problem"
        data-composition-id="problem"
        data-composition-src="compositions/problem.html"
        data-start="0"
        data-duration="3.8333"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="endcard"
        data-composition-id="endcard"
        data-composition-src="compositions/endcard.html"
        data-start="3.8333"
        data-duration="3.8"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
